<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>iNaturalist Compare Places</title>
    <link rel="stylesheet" href="css/pico.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style type="text/css">
        html,
body {
    min-height: 100vh;
}
        body {
            background-color: #2b3140;
            color: #9eb0d4;
            padding: 1rem;
        }

        a {
            text-decoration: none;
        }

        a:link {
            color: #6791ef;
        }

        a:visited {
            color: #334979;
        }

        a:hover {
            color: #4c81f3;
        }

        a:active {
            color: #4c81f3;
        }

        .instructions {
            color: #9eb0d4;
        }

        input#here,
        input#there,
        input#radius {
            width: 6ch !important;
            padding-left: 5px;
            padding-right: 5px;
        }

        #search-form button {
            width: auto;
            display: block;
            margin: 0 auto;
        }

        .creature {
            border: 1px solid black;
            margin: 10px;
            padding: 10px;
            color: #9eb0d4;
            background-color: #151d30;
            box-shadow: 3px 3px 5px 3px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .creature h2 {
            margin: 5px;
        }

        #content {
            border: 1px solid black;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 1rem;
        }

        #loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            margin: 20px;
            /* Or specify a height */
        }
    </style>

</head>

<body>
    <div id="content">
        <form id="search-form">
            <span class="instructions">Show me species that live in <input type="text" id="there" placeholder="90210" maxlength="5" pattern="[0-9]{5}"> but not <input type="text" id="here" placeholder="42069" maxlength="5" pattern="[0-9]{5}"></span>
            <div>
                <label for="radius">Radius In Miles: </label><input type="text" id="radius" placeholder="5" maxlength="3" pattern="[0-9]{1,3}">
            </div>
            <div>
                <div><label for="categories">Search Only These Categories (Optional):</label></div>
                <input type="checkbox" name="categories[]" value="Aves"/>Birds<br />
                <input type="checkbox" name="categories[]" value="Plantae"/>Plants<br />
                <input type="checkbox" name="categories[]" value="Amphibia"/>Amphibians<br />
                <input type="checkbox" name="categories[]" value="Reptilia"/>Reptiles<br />
                <input type="checkbox" name="categories[]" value="Mammalia"/>Mammals<br />
                <input type="checkbox" name="categories[]" value="Actinopterygii"/>Fishes<br />
                <input type="checkbox" name="categories[]" value="Mollusca"/>Molluscs<br />
                <input type="checkbox" name="categories[]" value="Protozoa"/>Protozoa<br />
                <input type="checkbox" name="categories[]" value="Fungi"/>Fungi<br />
                <input type="checkbox" name="categories[]" value="Insecta"/>Insects<br />
                <input type="checkbox" name="categories[]" value="Arachnida"/>Arachnids<br />
            </div>
            <button type="submit">Compare</button>
        </form>
        <div id="loader"><img src="images/giphy.webp" /></div>
        <div id="total"></div>
        <div id="creature-container"></div>
    </div>
    <script>
        function setCreatureH2(creature) {
                const hasCommonName = !!creature.common_name;
                const hasWikiLink = !!creature.wiki;
                let out = '<h2>';

                if (hasWikiLink) {
                    out += `<a href="${creature.wiki}" target="_blank">`;
                }
                if (hasCommonName) {
                    out += creature.common_name;
                } else {
                    out += scientificName(creature);
                }

                if (hasWikiLink) {
                    out += '</a>';
                }

                out += '</h2><p>';

                if (hasCommonName) {
                    out += scientificName(creature);
                    out += ` | `;
                }

                out += `<a href="${creature.observations}" target="_blank">${creature.count} observation`;
                if (creature.count != '1') out += 's';
                out += '</a>';

                out += '</p>';

                return out;
            }

        function scientificName(creature) {
            let out = '';
            if (creature.rank == 'genus' || creature.rank == 'species') {
                out += '<i>';
            }

            out += creature.scientific_name;

            if (creature.rank == 'genus' || creature.rank == 'species') {
                out += '</i>';
            }

            return out;
        }

        document.addEventListener("DOMContentLoaded", function () { 
            

            const loader = document.getElementById('loader');
            const searchForm = document.getElementById('search-form');
            const creatureContainer = document.getElementById('creature-container');
            const total = document.getElementById('total');

            loader.style.display = 'none';

            searchForm.addEventListener('submit', function (event) {
                event.preventDefault();

                loader.style.display = 'flex';
                creatureContainer.innerHTML = '';
                total.innerHTML = '';

                //let here = new URL(document.getElementById('here').value);
                //let there = new URL(document.getElementById('there').value);
                //here = here.search.substring(1);
                //there = there.search.substring(1);

                let here = document.getElementById('here').value;
                let there = document.getElementById('there').value;
                let radius = document.getElementById('radius').value || 5;
                let categories = [...document.querySelectorAll('input[name="categories[]"]:checked')].map(el => el.value).join(',');

                let htmlContent = '';

                let url = 'https://www.jasonjbru.net/api/compare-creatures/' + here + '/' + there + '/' + radius + '/' + categories;
                //let url = 'http://localhost:3000/compare-creatures/' + here + '/' + there + '/' + categories;
                console.log(url);
                fetch(url)
                    .then(response => response.json())
                    .then(creatures => {
                        window.creatures = creatures;
                        loader.style.display = 'none';
                        total.innerHTML = '<h2>' + creatures.length + ' Species Appear In ' + there + ' But Not In ' + here + '</h2>';

                        creatures.forEach(creature => {
                            htmlContent += `
                        <div class="creature">`;
                    //         if (creature.common_name) {
                                
                    //             htmlContent += `
                    //         <h2>${creature.common_name}</h2>
                    //         <p><i>${creature.scientific_name}</i> | ${creature.count} observations</p>
                    // `;
                    //         } else {
                    //             htmlContent += `
                    //         <h2><i>${creature.scientific_name}</i> | ${creature.count} observations</h2>
                    //         `;
                    //         }

                            htmlContent += setCreatureH2(creature);
                            htmlContent += `
                            <img src="${creature.image_url}" alt="${creature.common_name}">
                            </div>
                        `;

                        });
                        creatureContainer.innerHTML = htmlContent;
                    });
            })
        })

        async function getCoordinatesFromZip(zip) {

        }
    </script>
</body>

</html>
