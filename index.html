<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>iNaturalist Compare Places</title>
    <link rel="stylesheet" href="css/pico.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style type="text/css">
        html,
body {
    min-height: 100vh;
}
        body {
            background-color: #2b3140;
            color: #9eb0d4;
            padding: 1rem;
        }

        a {
            text-decoration: none;
        }

        a:link {
            color: #6791ef;
        }

        a:visited {
            color: #334979;
        }

        a:hover {
            color: #4c81f3;
        }

        a:active {
            color: #4c81f3;
        }

        article {
            margin-top: 10px !important;
        }

        input {
            margin-bottom: 0px !important;
        }

        .instructions {
            color: #9eb0d4;
        }
        .swap {
            display: inline !important;
            width: auto;
            margin: 0;
            padding: 0.25rem 0.5rem;
        }

        input#here,
        input#there,
        input#radius {
            width: 6ch !important;
            padding-left: 5px;
            padding-right: 5px;
        }

        .cats-of-gory {
            padding-bottom: 10px;
        }

        #search-form button {
            width: auto;
            display: block;
            margin: 0 auto;
        }

        .creature {
            /* border: 1px solid black; */
            /* margin: 10px; */
            padding: 10px;
            color: #9eb0d4;
            background-color: #151d30;
            box-shadow: 3px 3px 5px 3px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .creature h2 {
            margin: 5px;
        }

        .content {
            /* border: 1px solid black; */
            /* margin-top: 10px !important; */
            max-width: 800px;
            width: 100%;
            margin: 10px auto 0 auto !important;
            /* padding: 1rem; */
        }

        .creature-container {
            display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
        }

        #loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            margin: 20px;
            /* Or specify a height */
        }
    </style>

</head>

<body>
    <nav class="content" style="border: none;">
        <ul>
            <li><strong>Wild & Free</strong></li>
        </ul>
        <ul>
            <li><a href="#">Donate</a></li>
            <li><a href="#">FAQ</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
    <article class="content">
        <form id="search-form">
            <span class="instructions">Show me species that live in 
                <input type="text" id="there" placeholder="90210" maxlength="5" pattern="[0-9]{5}" oninvalid="this.setCustomValidity('Please enter a 5-digit US ZIP code.')" oninput="this.setCustomValidity('')" required> 
                but not 
                <input type="text" id="here" placeholder="42069" maxlength="5" pattern="[0-9]{5}" oninvalid="this.setCustomValidity('Please enter a 5-digit US ZIP code.')" oninput="this.setCustomValidity('')" required>.
                <!-- <small>Must be 5-digit US zip codes.</small>  -->
                <button type="button" class="swap" id="swap">⇄</button>
            </span>
            <div>
                <label for="radius">Radius In Miles: </label><input type="text" id="radius" placeholder="5" maxlength="3" pattern="[0-9]{1,3}">
                
            </div>
            <div style="padding-top: 10px;">
                <label>
                    <input name id="current" type="checkbox" role="switch" />
                    Only show species active now
                </label>
            </div>
            <div class="cats-of-gory">
                <div><label for="categories">Search Only These Categories (Optional):</label></div>
                <div class="grid">
                    <div><input type="checkbox" name="categories[]" value="Aves"/>Birds<br /></div>
                    <div><input type="checkbox" name="categories[]" value="Plantae"/>Plants<br /></div>
                    <div><input type="checkbox" name="categories[]" value="Amphibia"/>Amphibians<br /></div>
                    <div><input type="checkbox" name="categories[]" value="Reptilia"/>Reptiles<br /></div>
                </div>
                <div class="grid">
                    <div><input type="checkbox" name="categories[]" value="Mammalia"/>Mammals<br /></div>
                    <div><input type="checkbox" name="categories[]" value="Actinopterygii"/>Fishes<br /></div>
                    <div><input type="checkbox" name="categories[]" value="Mollusca"/>Molluscs<br /></div>
                    <div><input type="checkbox" name="categories[]" value="Protozoa"/>Protozoa<br /></div>
                </div>
                <div class="grid">
                    <div><input type="checkbox" name="categories[]" value="Fungi"/>Fungi<br /></div>
                    <div><input type="checkbox" name="categories[]" value="Insecta"/>Insects<br /></div>
                    <div><input type="checkbox" name="categories[]" value="Arachnida"/>Arachnids<br /></div>
                    <div><input type="checkbox" name="categories[]" value=""/>All<br /></div>
                </div>
            </div>
            <button type="submit">Compare</button>
        </form>
        </article>
        <article class="content" id="loader" style="display: none;">
            <div><img src="images/giphy.webp" /></div>
        </article>
        <article class="content" id="total" style="display: none;"></article>
        <div class="content" id="creature-container" style="display: none;"></div>
    
    <script>
        function setCreatureH2(creature) {
                const hasCommonName = !!creature.common_name;
                const hasWikiLink = !!creature.wiki;
                let out = '<h2>';

                if (hasWikiLink) {
                    out += `<a href="${creature.wiki}" target="_blank">`;
                }
                if (hasCommonName) {
                    out += creature.common_name;
                } else {
                    out += scientificName(creature);
                }

                if (hasWikiLink) {
                    out += '</a>';
                }

                out += '</h2><p>';

                if (hasCommonName) {
                    out += scientificName(creature);
                    out += ` | `;
                }

                out += `<a href="${creature.observations}" target="_blank">${creature.count} observation`;
                if (creature.count != '1') out += 's';
                out += '</a>';

                out += '</p>';

                return out;
            }

        function scientificName(creature) {
            let out = '';
            if (creature.rank == 'genus' || creature.rank == 'species') {
                out += '<i>';
            }

            out += creature.scientific_name;

            if (creature.rank == 'genus' || creature.rank == 'species') {
                out += '</i>';
            }

            return out;
        }

        document.addEventListener("DOMContentLoaded", function () { 
            let params = new URLSearchParams(document.location.search);
            const testing = params.get("testing");
            const loader = document.getElementById('loader');
            const searchForm = document.getElementById('search-form');
            const creatureContainer = document.getElementById('creature-container');
            const total = document.getElementById('total');
            const swapButton = document.getElementById('swap'); 

            
            
            swapButton.addEventListener('click', function (e) {
                let here = document.getElementById('here');
                let there = document.getElementById('there');
                
                if (here.value && here.value != '' && there.value && there.value != '') {
                    let newHere = there.value;
                    let newThere = here.value;

                    here.value = newHere;
                    there.value = newThere;
                }
            })

            searchForm.addEventListener('submit', function (event) {
                event.preventDefault();

                loader.style.display = 'flex';
                
                creatureContainer.innerHTML = '';
                total.innerHTML = '';

                let here = document.getElementById('here').value;
                let there = document.getElementById('there').value;
                let radius = document.getElementById('radius').value || 5;
                let current = document.getElementById('current').checked; 
                let categories = [...document.querySelectorAll('input[name="categories[]"]:checked')].map(el => el.value).join(',');

                let htmlContent = '';

                let basedUrl = testing ? 'http://localhost:3000/' : 'https://www.jasonjbru.net/api/';

                let url = basedUrl + 'compare-creatures/' + here + '/' + there + '/' + radius + '/' + categories;
                if (current) {
                    url += '?current=1'
                }

                //let url = 'http://localhost:3000/compare-creatures/' + here + '/' + there + '/' + radius + '/' + categories;
                console.log(url);
                fetch(url)
                    .then(response => response.json())
                    .then(creatures => { 
                        window.creatures = creatures;
                        loader.style.display = 'none';
                        total.style.display = 'flex';
                        creatureContainer.style.display = 'block';
                        
                        let currentString = '';

                        if (creatures.current == 1) {
                            currentString = ' During ';
                            let month = new URLSearchParams(creatures.locales.there.inatLink).get("month");
                            
                            if (month.includes(',')) {
                                let months = month.split(',').map(Number);
                                currentString += `${getMonthFromInt(months[0])} and ${getMonthFromInt(months[1])}`;
                            } else {
                                currentString += getMonthFromInt(month);
                            }

                            console.log(currentString);
                        }
                        console.log(currentString); 
                        total.innerHTML = `
                            <h2>
                                ${creatures.results.length} Species Appear In <a href="${creatures.locales.there.inatLink}" target="_blank">${there}</a> 
                                But Not In <a href="${creatures.locales.here.inatLink}" target="_blank">${here}</a>
                                ${currentString}
                            </h2>`;

                        creatures.results.forEach(creature => {
                            const imageUrl = window.innerWidth >= 768
                            ? creature.image_url.replace('medium', 'large')
                            : creature.image_url;
                            htmlContent += `
                        <article class="creature">`;
                            htmlContent += setCreatureH2(creature);
                            htmlContent += `
                            <img src="${imageUrl}" alt="${creature.common_name}">
                            </article>
                        `;

                        });
                        creatureContainer.innerHTML = htmlContent;
                    });
            })
        })

        function getMonthFromInt(month) {
            return [
                'January',
                'February',
                'March',
                'April',
                'May',
                'June',
                'July',
                'August',
                'September',
                'October',
                'November',
                'December'
            ][month - 1];
        }
    </script>
</body>

</html>
